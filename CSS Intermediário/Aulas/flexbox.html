<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>
    <STyle type="TEXT/cSS">
        #container{
            display: flex;
            
            justify-content:space-around;
            align-items: center;
            background-color: dimgray;
            width: 90%;
            height: 400px;
        }
        .caixa{
            display: block;
            height: 100px;
            width: 100px;
            background-color: white;           
            box-shadow: -8px 8px 15px red;
        }
        
    </STyle>
</head>
<body>
    <DIV id="container">
        <div class="caixa">CAIXA 01</div>
        <div class="caixa">CAIXA 02</div>
        <div class="caixa">CAIXA 03</div>
        <div class="caixa">CAIXA 04</div>

    </DIV>
</body>
</html>
