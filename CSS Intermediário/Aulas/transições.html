<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula sobre transições</title>
    <style type="text/css">
                
        .caixa{
            height: 300px;
            width: 300px;
            background: orange;
        }
        .caixa:hover{
            width: 400px;
            background: yellow;
            transition: all 3s;
        }
    </style>
</head>
<body>
    <div class="caixa"></div>
</body>
</html>
